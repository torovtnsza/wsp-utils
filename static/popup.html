<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f0f2f5; --card: #fff; --text: #111b21; --muted: #667781; --line: #e9edef;
    --accent: #00a884; --accent-text: #fff; --danger: #d93025;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b141a; --card: #111b21; --text: #e9edef; --muted: #8696a0; --line: #222d34; --accent-text: #0b141a; }
  }
  * { box-sizing: border-box }
  body { width: 360px; margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif }
  header { display: flex; align-items: center; gap: 8px; margin: 0 4px 12px; font-weight: 600; font-size: 15px }
  header::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent) }
  section { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .08) }
  h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); text-wrap: balance }
  form { display: grid; gap: 6px }
  input:not([type=checkbox]), textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: inherit; font: inherit;
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
  textarea { resize: vertical }
  input[type=file] { padding: 5px; color: var(--muted) }
  label.check { display: flex; align-items: center; gap: 6px; color: var(--muted) }
  .hint { margin: 0 0 0 22px; color: var(--muted); font-size: 12px; text-wrap: pretty }
  .hint a { color: var(--accent) }
  .hint code { display: block; margin-top: 4px; padding: 6px 8px; border-radius: 6px; background: var(--bg); font-size: 11px; word-break: break-all; user-select: all }
  .add { justify-self: end; padding: 6px 16px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer }
  ul { list-style: none; margin: 10px 0 0; padding: 0 }
  ul:empty::before { content: attr(data-empty); display: block; padding: 8px 0 2px; color: var(--muted); text-align: center; text-wrap: pretty }
  li { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line) }
  li > div { flex: 1; min-width: 0 }
  li strong { display: block; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  li span { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); white-space: pre-wrap }
  .del { flex: none; width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer }
  .del:hover { background: var(--line); color: var(--danger) }
</style>
<header>wsp-utils</header>
<section>
  <h2>Schedule</h2>
  <form id="sForm">
    <input id="chat" required placeholder="Chat name (exact, as in the chat list)">
    <input id="text" required placeholder="Message">
    <input id="at" required type="datetime-local">
    <button class="add">Schedule</button>
  </form>
  <ul id="sched" data-empty="Nothing scheduled yet. Pick a chat and a time above."></ul>
</section>
<section>
  <h2>Commands</h2>
  <form id="cForm">
    <input id="cmd" required placeholder="!ping">
    <textarea id="reply" rows="3" placeholder="pong (caption if a file is attached)"></textarea>
    <input id="file" type="file">
    <label class="check"><input id="gif" type="checkbox"> Send video as GIF (loops, no sound)</label>
    <p class="hint">Have a .gif? Convert it to MP4 first at <a href="https://ezgif.com/gif-to-mp4" target="_blank">ezgif.com</a> or with ffmpeg:
      <code>ffmpeg -i in.gif -movflags faststart -pix_fmt yuv420p -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" out.mp4</code></p>
    <button class="add">Add command</button>
  </form>
  <ul id="cmds" data-empty="No commands yet. Add a trigger like !ping above."></ul>
</section>
<script src="popup.js"></script>
