<!doctype html>
<meta charset="utf-8">
<style>
  /* Colorless dark glass; the color is in the accents, and no one hue dominates.
     --tone is a section's accent, --row a list row's (set by popup.ts). */
  :root {
    --bg: #0e1013; --text: #eef0f3; --muted: #9ba1a8; --line: rgb(255 255 255 / .1);
    --green: #5cf2a0; --orange: #ff9f43; --pink: #ff5fa2; --cyan: #3ee6ff; --violet: #a66bff; --yellow: #ffd23f;
    --danger: #ff5c8a; --tone: var(--green);
    color-scheme: dark;
  }
  * { box-sizing: border-box }
  html {
    min-height: 100%; scrollbar-width: none;
    background: linear-gradient(180deg, rgb(255 255 255 / .04), transparent 40%), var(--base, var(--bg));
  }
  .embed { --base: rgb(14 16 20 / .62) } /* the WhatsApp panel lets the chats show through (panel.ts blurs them) */
  body { width: 360px; margin: 0; padding: 12px; color: var(--text); font: 13px/1.4 system-ui, sans-serif }
  .embed body { width: auto } /* in the WhatsApp hover panel the frame sets the width */
  /* Thin red line that closes the panel / popup; the button is taller than the line so it's easy to hit. */
  #close { display: block; width: 100%; height: 14px; margin: -4px 0 6px; padding: 0; border: 0; background: none; cursor: pointer }
  #close::before { content: ""; display: block; height: 3px; border-radius: 999px; background: #ff3b5c; box-shadow: 0 0 4px rgb(255 59 92 / .4); transition: box-shadow .6s ease }
  #close:hover::before { box-shadow: 0 0 10px rgb(255 59 92 / .8), 0 0 22px rgb(255 59 92 / .45) }
  #close:focus-visible { outline: none }
  #close:focus-visible::before { outline: 2px solid #ff3b5c; outline-offset: 3px }
  /* --rx/--ry: lean toward the cursor, set by popup.ts */
  section {
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    position: relative; margin-bottom: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px;
    background: linear-gradient(180deg, rgb(255 255 255 / .06), rgb(255 255 255 / .02));
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .06), 0 8px 24px rgb(0 0 0 / .35);
    transition: border-color .2s, box-shadow .2s, transform .3s ease-out;
  }
  .hiding *, .hiding *::after { transition: none !important } /* sliding out: see popup.ts */
  section:nth-of-type(2) { --tone: var(--orange) }
  section:focus-within {
    border-color: color-mix(in srgb, var(--tone) 50%, transparent);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .06), 0 8px 24px rgb(0 0 0 / .35), 0 0 24px color-mix(in srgb, var(--tone) 14%, transparent);
  }
  h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
  h2::before { content: ""; width: 14px; height: 3px; border-radius: 2px; background: var(--tone); box-shadow: 0 0 8px var(--tone) }
  form { display: grid; gap: 6px }
  input:not([type=checkbox]), textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
    background: rgb(0 0 0 / .25); color: inherit; font: inherit; transition: border-color .15s, box-shadow .15s;
  }
  #chat[aria-invalid=true] { color: var(--danger); text-shadow: 0 0 6px rgb(255 92 138 / .55) }
  input::placeholder, textarea::placeholder { color: rgb(155 161 168 / .7) }
  input:focus-visible, textarea:focus-visible { outline: none; border-color: var(--tone); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 20%, transparent) }
  button:focus-visible { outline: 2px solid var(--tone); outline-offset: 2px }
  textarea { resize: vertical }
  input[type=file] { padding: 5px; color: var(--muted) }
  input[type=file]::file-selector-button { margin-right: 8px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: rgb(255 255 255 / .05); color: var(--text); font: inherit; cursor: pointer }
  input[type=checkbox] { accent-color: var(--tone) }
  label.check { display: flex; align-items: center; gap: 6px; color: var(--muted) }
  .hint { margin: 0 0 0 22px; color: var(--muted); font-size: 12px; text-wrap: pretty }
  .hint a { color: var(--tone) }
  .hint code { display: block; margin-top: 4px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: rgb(0 0 0 / .3); font-size: 11px; word-break: break-all; user-select: all }
  ul { list-style: none; margin: 10px 0 0; padding: 0 }
  ul:empty::before { content: attr(data-empty); display: block; padding: 8px 0 2px; color: var(--muted); text-align: center; text-wrap: pretty }
  /* Rows reach 8px into the card's padding on each side, so the hover box (below) has room around the text. */
  li { position: relative; display: flex; align-items: flex-start; gap: 8px; margin: 0 -8px; padding: 8px; border-radius: 10px; transition: background .2s, box-shadow .2s }
  li::after { content: ""; position: absolute; inset: 0 8px auto; height: 1px; background: var(--line); transition: opacity .2s } /* separator */
  /* The card's own padding is enough below the last row; keep 6px for the hover box. */
  li:last-child { padding-bottom: 6px; margin-bottom: -6px }
  /* Hovering × marks the whole row for deletion; the separators that would cut through its outline hide. */
  li:has(.del:hover) { background: rgb(255 92 138 / .07); box-shadow: inset 0 0 0 1px rgb(255 92 138 / .5), 0 0 14px rgb(255 92 138 / .3) }
  li:has(.del:hover)::after, li:has(.del:hover) + li::after { opacity: 0 }
  /* Sent messages stay listed, outlined in green; hovering × only makes the green stronger. */
  li.sent { background: rgb(92 242 160 / .05); box-shadow: inset 0 0 0 1px rgb(92 242 160 / .35), 0 0 12px rgb(92 242 160 / .18) }
  li.sent:has(.del:hover) { background: rgb(92 242 160 / .1); box-shadow: inset 0 0 0 1px rgb(92 242 160 / .7), 0 0 18px rgb(92 242 160 / .4) }
  li.sent::after, li.sent + li::after { opacity: 0 }
  li > div { position: relative; flex: 1; min-width: 0; padding-left: 11px }
  li > div::before { content: ""; position: absolute; inset: 2px auto 2px 0; width: 3px; border-radius: 999px; background: var(--row); box-shadow: 0 0 8px var(--row) }
  li strong { display: block; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  li span { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); white-space: pre-wrap }
  /* As tall as the row's text, so it's an easy target without crowding the separators. */
  .del { flex: none; align-self: stretch; width: 56px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; transition: color .2s }
  .del:hover { color: var(--danger) }
  .sent .del:hover { color: var(--green) }
  /* Settings tucked into the bottom corners (shortcut left, rate limit right), each shown only while hovered or being edited. */
  footer { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: -4px; color: var(--muted); font-size: 11px }
  footer > * { display: flex; align-items: center; gap: 5px; white-space: nowrap; opacity: 0; transition: opacity .3s }
  footer > :last-child { margin-left: auto } /* stays right, even on its own line when the panel is narrow */
  footer > :hover, footer > :focus-within { opacity: 1 }
  footer input:not([type=checkbox]) { padding: 2px 4px; border-radius: 6px; text-align: center }
  #hotkey { width: 13ch; cursor: pointer; caret-color: transparent }
  .rate input { width: calc(3ch + 12px); appearance: textfield }
  .rate input::-webkit-inner-spin-button { appearance: none }
</style>
<button id="close" aria-label="Close" title="Close"></button>
<section>
  <h2>Schedule</h2>
  <form id="sForm">
    <input id="chat" required placeholder="Chat name (exact, as in the chat list), or &quot;me&quot;">
    <input id="text" required placeholder="Message">
    <input id="at" required type="datetime-local">
  </form>
  <ul id="sched" data-empty="Nothing scheduled yet. Pick a chat and a time above."></ul>
</section>
<section>
  <h2>Commands</h2>
  <form id="cForm">
    <input id="cmd" required placeholder="!ping">
    <textarea id="reply" rows="3" placeholder="pong (caption if a file is attached; Shift+Enter for a new line)"></textarea>
    <input id="file" type="file">
    <label class="check"><input id="gif" type="checkbox"> Send video as GIF (loops, no sound)</label>
    <p class="hint">Have a .gif? Convert it to MP4 first at <a href="https://ezgif.com/gif-to-mp4" target="_blank">ezgif.com</a> or with ffmpeg:
      <code>ffmpeg -i in.gif -movflags faststart -pix_fmt yuv420p -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" out.mp4</code></p>
  </form>
  <ul id="cmds" data-empty="No commands yet. Add a trigger like !ping above."></ul>
</section>
<footer>
  <label title="Click, then press a new shortcut (with Ctrl, Alt or ⊞/⌘, or an F key). Backspace restores Alt+W.">
    Shortcut <input id="hotkey" readonly>
  </label>
  <form id="rForm" class="rate" title="Limits auto-replies to other people. Your own commands always run.">
    Auto-replies: max <input id="rCount" type="number" required min="1" max="999" aria-label="Replies per chat">
    per chat / <input id="rMins" type="number" required min="1" max="1440" aria-label="Minutes"> min
  </form>
</footer>
<script src="popup.js"></script>
